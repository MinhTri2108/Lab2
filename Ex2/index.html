<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survey Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <link href="style.css" rel="stylesheet">
</head>
<body>

<div class="survey-box">
  <img src="IU.png" alt="IU Logo">
  <h2>Survey</h2>
  <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>

  <h3>Your information</h3>
  <form>
    <div class="input-group mb-3">
        <div class="input-group-prepend">
          <span class="input-group-text">@</span>
        </div>
        <input type="text" class="form-control" placeholder="Firstname">
    </div>

    <div class="input-group mb-3">
        <div class="input-group-prepend">
          <span class="input-group-text">@</span>
        </div>
        <input type="text" class="form-control" placeholder="Lastname">
    </div>

    <div class="input-group mb-3">
        <input type="text" class="form-control" placeholder="Your Email">
        <div class="input-group-append">
            <span class="input-group-text">@example.com</span>
        </div>
    </div>

    <div class="input-group mb-3">
        <div class="input-group-prepend">
            <span class="input-group-text">DoB<i class="far fa-calendar-alt"></i></span>
        </div>
        <input type="date" class="form-control" id="dob" name="dob">
    </div>

    <h3>How did you hear about us?</h3>
    <div class="form-check-inline">
        <label class="form-check-label">
          <input type="radio" class="form-check-input" value="">Search engine
        </label>
    </div>

    <div class="form-check-inline">
    <label class="form-check-label">
        <input type="radio" class="form-check-input" value="">Word of mouth
    </label>
    </div>

    <div class="form-check-inline">
    <label class="form-check-label">
        <input type="radio" class="form-check-input" value="">Social Media
    </label>
    </div>
    
    <div class="form-check-inline">
    <label class="form-check-label">
        <input type="radio" class="form-check-input" value="">Other
    </label>
    </div>

    <h3>Would you like to receive announcements<br>about new CDs and special offers?</h3>
    <div class="form-check">
        <label class="form-check-label">
          <input type="checkbox" class="form-check-input" value="">YES, I'd like that.
        </label>
      </div>
      <div class="form-check">
        <label class="form-check-label">
          <input type="checkbox" class="form-check-input" value="">YES, please send me email announcements.
        </label>
      </div>

    <div style="margin-top: 20px; margin-left: 0%;">
      <label style="font-weight:bold;">Please contact me by:</label><br>
      <select>
        <option>Email or postal mail</option>
        <option>Email only</option>
        <option>Postal mail only</option>
      </select>
    </div>

    <input type="submit" value="Submit">
  </form>
</div>
</body>
</html>
